name: Seoul Real Estate Daily Report

on:
  schedule:
    # 09:00 KST is 00:00 UTC (9 hours difference)
    - cron: '17 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Seoul Real Estate Daily Report
      env:
        MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }} # Gmail App Password
        EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      run: |
        python main.py
